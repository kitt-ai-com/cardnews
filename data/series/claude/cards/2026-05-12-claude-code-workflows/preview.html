    --bg: #06101d;
    --bg-2: #020711;
    --panel: rgba(255,255,255,0.055);
    --panel-2: rgba(37,130,255,0.09);
    --text: #f7fbff;
    --muted: rgba(247,251,255,0.62);
    --muted-2: rgba(247,251,255,0.34);
    --line: rgba(247,251,255,0.11);
    --accent: #4da3ff;
    --accent-2: #7de2ff;
    --good: #5ee6a8;
    --warn: #ffcc66;
    --safe-x: 58px;
    --y-strip: 60px;
    --y-page: 130px;
    --y-label: 214px;
    --y-title: 276px;
    --y-content: 560px;
    --y-callout: 1086px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html,
  body {
    background: #121820;
    color: var(--text);
    font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    padding: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  h1 {
    width: 1112px;
    max-width: 100%;
    font-size: 28px;
    font-weight: 850;
    letter-spacing: 0;
  }

  .meta {
    width: 1112px;
    max-width: 100%;
    margin-top: -18px;
    color: rgba(255,255,255,0.56);
    font-size: 14px;
    line-height: 1.5;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 540px);
    gap: 32px;
  }

  .card-wrap { width: 540px; }

  .card {
    width: 540px;
    height: 675px;
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    background: var(--bg);
    box-shadow: 0 24px 60px rgba(0,0,0,0.36);
  }

  .card-inner {
    width: 1080px;
    height: 1350px;
    transform: scale(0.5);
    transform-origin: top left;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 92% 8%, rgba(77,163,255,0.24), transparent 280px),
      linear-gradient(145deg, var(--bg) 0%, var(--bg-2) 78%);
    color: var(--text);
    letter-spacing: 0;
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  .card-inner::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(rgba(255,255,255,0.032) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.032) 1px, transparent 1px);
    background-size: 54px 54px;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0.72), transparent 74%);
    pointer-events: none;
  }

  .card-inner::after {
    content: "";
    position: absolute;
    left: 58px;
    right: 58px;
    bottom: 122px;
    height: 1px;
    background: var(--line);
  }

  .brand {
    position: absolute;
    top: var(--y-strip);
    left: var(--safe-x);
    right: var(--safe-x);
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--muted);
    font-size: 23px;
    line-height: 1.2;
    z-index: 2;
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #03111f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 900;
    box-shadow: 0 0 42px rgba(77,163,255,0.26);
    flex-shrink: 0;
  }

  .handle { color: var(--text); font-weight: 780; }
  .sep { color: var(--muted-2); }
  .series { color: var(--muted); }
  .tag { margin-left: auto; color: var(--accent-2); font-weight: 780; font-size: 22px; }

  .page {
    position: absolute;
    top: var(--y-page);
    right: var(--safe-x);
    color: var(--muted-2);
    font-size: 26px;
    font-weight: 720;
    letter-spacing: 0.04em;
    z-index: 2;
  }

  .label {
    position: absolute;
    top: var(--y-label);
    left: var(--safe-x);
    right: var(--safe-x);
    color: var(--accent-2);
    font-size: 24px;
    font-weight: 820;
    line-height: 1.2;
    z-index: 2;
  }

  .title {
    position: absolute;
    top: var(--y-title);
    left: var(--safe-x);
    right: var(--safe-x);
    font-size: 72px;
    font-weight: 920;
    line-height: 1.13;
    z-index: 2;
  }

  .title .accent,
  .cover-title .accent,
  .summary-title .accent {
    color: var(--accent);
  }

  .subtitle {
    position: absolute;
    top: 450px;
    left: var(--safe-x);
    right: var(--safe-x);
    color: var(--text);
    font-size: 34px;
    font-weight: 760;
    line-height: 1.34;
    z-index: 2;
  }

  .content {
    position: absolute;
    top: var(--y-content);
    left: var(--safe-x);
    right: var(--safe-x);
    z-index: 2;
  }

  .body {
    color: var(--muted);
    font-size: 30px;
    font-weight: 520;
    line-height: 1.55;
  }

  .body p + p { margin-top: 24px; }

  code {
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.86em;
    color: #d7efff;
    background: rgba(77,163,255,0.16);
    border: 1px solid rgba(77,163,255,0.26);
    border-radius: 8px;
    padding: 2px 10px;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    min-height: 48px;
    padding: 10px 18px;
    border-radius: 8px;
    background: rgba(77,163,255,0.12);
    border: 1px solid rgba(125,226,255,0.22);
    color: var(--text);
    font-size: 24px;
    font-weight: 740;
  }

  .mini-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    margin-top: 32px;
  }

  .mini {
    min-height: 138px;
    padding: 24px;
    border-radius: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
  }

  .mini b {
    display: block;
    color: var(--accent-2);
    font-size: 22px;
    margin-bottom: 8px;
  }

  .mini span {
    color: var(--text);
    font-size: 26px;
    font-weight: 720;
    line-height: 1.32;
  }

  .steps {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .step {
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 18px;
    align-items: start;
    padding: 22px 24px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  .step .num {
    width: 64px;
    height: 64px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel-2);
    color: var(--accent-2);
    font-size: 27px;
    font-weight: 900;
  }

  .step b {
    display: block;
    color: var(--text);
    font-size: 28px;
    line-height: 1.32;
    margin-bottom: 6px;
  }

  .step span {
    display: block;
    color: var(--muted);
    font-size: 24px;
    line-height: 1.42;
  }

  .callout {
    position: absolute;
    top: var(--y-callout);
    left: var(--safe-x);
    right: var(--safe-x);
    min-height: 128px;
    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 8px;

    font-size: 27px;
    font-weight: 760;
    line-height: 1.38;
    text-align: center;
    z-index: 2;

  .callout::before {
    content: "POINT";
    position: absolute;
    top: -18px;
    left: 26px;
    padding: 4px 10px;
    border-radius: 6px;
    background: #08213b;

    color: var(--accent-2);
    font-size: 17px;
    font-weight: 880;

    position: absolute;
    top: 220px;
    left: var(--safe-x);

    color: var(--muted);

    line-height: 1.52;

  .keyword-box {

    right: var(--safe-x);
    padding: 30px;
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--line);

    color: var(--accent-2);
    font-size: 22px;
    font-weight: 860;
    margin-bottom: 20px;

  .cover .chips .chip { font-size: 23px; }

  .summary-title {

    left: var(--safe-x);
    right: var(--safe-x);
    font-size: 82px;
    font-weight: 940;
    line-height: 1.09;

    position: absolute;

    left: 92px;
    right: 92px;
    color: var(--muted);
    font-size: 31px;
    line-height: 1.52;

    gap: 18px;
    align-items: center;
    padding: 18px 22px;
    border-radius: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 28px;
    font-weight: 740;
    line-height: 1.24;

  .summary-item .check {
    color: var(--accent-2);
    font-weight: 900;
  }

  .card-label {
    color: rgba(255,255,255,0.54);
    font-size: 13px;
    line-height: 1.4;
    margin-top: 8px;
    text-align: center;
  }

  @media (max-width: 1140px) {
    body { padding: 24px; }
    .grid { grid-template-columns: 540px; }
    h1, .meta { width: 540px; }
  }
</style>
</head>

  {
    label: "13 · 컨텍스트 관리",
    title: "토큰도<br><span class='accent'>관리 대상</span>이다",
    subtitle: "Token 분석과 Status Line",
    body: [
      "불필요하게 로드되는 전역 스킬이 토큰을 낭비하고 있지 않은지 확인합니다.",
      "<code>/status line</code>을 활용하면 현재 컨텍스트 사용량과 남은 한도를 확인할 수 있습니다."
    ],
    point: "AI 작업에서는 코드 품질만큼 컨텍스트 관리도 중요합니다."
  },
  {
    label: "14 · 학습 루프",
    title: "AI로 코딩하면서<br><span class='accent'>실력</span>도 키워라",
    subtitle: "학습을 병행하는 코딩",
    body: [
      "Claude에게 단순히 코드를 만들게 하지 말고, 왜 그런 구조와 결정을 선택했는지 설명하게 합니다.",
      "결과물뿐 아니라 사용자의 엔지니어링 감각도 함께 성장합니다."
    ],
    point: "AI를 외주 개발자로 쓰지 말고 개인 튜터처럼 활용하세요."
  },
  {
    kind: "summary",
    label: "SUMMARY",
    title: "Claude Code를<br>잘 쓰는 사람들의<br><span class='accent'>공통점</span>",
    copy: "코드를 바로 시키지 않습니다.<br>먼저 계획하고, 검증하고, 자동화합니다.",
    items: [
      "브라우저로 직접 검증하게 하기",
      "브랜칭으로 실험 분리하기",
      "Worktrees로 병렬 개발하기",
      "Sub Agent로 리뷰 구조 만들기",
      "토큰과 컨텍스트 관리하기"
    ]
  }
];

const grid = document.getElementById("grid");
const total = cards.length;

function brand(page, tag = "#ClaudeCode") {
  return `
    <div class="brand">
      <div class="avatar">U</div>
      <span class="handle">kitt_AI_inc</span>
      <span class="sep">|</span>
      <span class="series">Claude Code workflows</span>
      <span class="tag">${tag}</span>
    </div>
    <div class="page">${String(page).padStart(2, "0")} / ${String(total).padStart(2, "0")}</div>
  `;
}

function footer(page) {
  return `
    <div class="footer">
      <span class="left">kitt_AI_inc</span>
      <span>${String(page).padStart(2, "0")}</span>
    </div>
  `;
}

function renderCover(card, page) {
  return `
    <div class="card-inner cover">
      ${brand(page, "#워크플로우")}
      <div class="cover-kicker">${card.label}</div>
      <div class="cover-title">${card.title}</div>
      <div class="cover-sub">${card.subtitle}</div>
      <div class="keyword-box">
        <div class="keyword-title">핵심 키워드</div>
        <div class="chips">${card.keywords.map((keyword) => `<span class="chip">${keyword}</span>`).join("")}</div>
      </div>
      ${footer(page)}
    </div>
  `;
}

function renderStandard(card, page) {
  const tagText = (card.label.split("·")[1] || "ClaudeCode").trim().replaceAll(" ", "");
  const tag = `#${tagText}`;
  const steps = card.steps ? `
    <div class="steps">
      ${card.steps.map((step, index) => `
        <div class="step">
          <div class="num">${String(index + 1).padStart(2, "0")}</div>
          <div><b>${step.title}</b><span>${step.text}</span></div>
        </div>
      `).join("")}
    </div>
  ` : "";

  return `
    <div class="card-inner">
      ${brand(page, tag)}
      <div class="label">${card.label}</div>
      <div class="title">${card.title}</div>
      <div class="subtitle">${card.subtitle}</div>
      <div class="content">
        ${steps || `<div class="body">${card.body.map((paragraph) => `<p>${paragraph}</p>`).join("")}</div>`}
      </div>
      <div class="callout">${card.point}</div>
      ${footer(page)}
    </div>
  `;
}

function renderSummary(card, page) {
  return `
    <div class="card-inner">
      ${brand(page, "#요약")}
      <div class="label" style="text-align:center">${card.label}</div>
      <div class="summary-title">${card.title}</div>
      <div class="summary-copy">${card.copy}</div>
      <div class="summary-list">
        ${card.items.map((item) => `<div class="summary-item"><span class="check">✓</span><span>${item}</span></div>`).join("")}
      </div>
      ${footer(page)}
    </div>
  `;
}

cards.forEach((card, index) => {
  const page = index + 1;
  const html = card.kind === "cover"
    ? renderCover(card, page)
    : card.kind === "summary"
      ? renderSummary(card, page)
      : renderStandard(card, page);

  const wrap = document.createElement("div");
  wrap.className = "card-wrap";
  wrap.innerHTML = `
    <div class="card">${html}</div>
    <div class="card-label">${String(page).padStart(2, "0")} · ${card.kind || "card"} · ${card.label}</div>
  `;
  grid.appendChild(wrap);
});
</script>
</body>
</html>
